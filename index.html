<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <h1 class="title">Three Cards</h1>
 
  <div class="game-board">
 
    <section class="player-panel" id="player1-panel">
      <div class="card-row" id="player1-cards">
        <div class="card-slot" id="p1-card-0"></div>
        <div class="card-slot" id="p1-card-1"></div>
        <div class="card-slot" id="p1-card-2"></div>
      </div>
      <p class="score-display" id="player1-score">Player 1: 0</p>
    </section>
 
    <section class="player-panel" id="player2-panel">
      <div class="card-row" id="player2-cards">
        <div class="card-slot" id="p2-card-0"></div>
        <div class="card-slot" id="p2-card-1"></div>
        <div class="card-slot" id="p2-card-2"></div>
      </div>
      <p class="score-display" id="player2-score">Player 2: 0</p>
    </section>
 
  </div>
 
  <button type="button" id="draw-button" class="draw-button">Draw Cards</button>
 
 
 
  <script src="script.js"></script>
</body>
</html>
